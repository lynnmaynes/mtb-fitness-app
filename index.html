<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MTB 12-Week</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <a href="#today" class="brand"><img src="icons/rider.svg" alt="">MTB<span>12</span></a>
  <div id="weekInfo"></div>
  <button id="syncBtn" class="sync" title="Sync now"><span id="syncDot"></span><span id="syncTxt">Sync</span></button>
</header>
<main id="view"></main>
<div id="restBar" hidden>
  <div class="restInner"><span id="restLbl">Rest</span><b id="restTime">0:00</b>
    <button data-rest="+15">+15s</button><button data-rest="skip">Skip</button></div>
  <div id="restProg"></div>
</div>
<nav id="tabs">
  <a href="#today" data-tab="today">Today</a>
  <a href="#week" data-tab="week">Week</a>
  <a href="#stretch" data-tab="stretch">Stretch</a>
  <a href="#rides" data-tab="rides">Rides</a>
  <a href="#progress" data-tab="progress">Progress</a>
  <a href="#settings" data-tab="settings">⚙</a>
</nav>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
